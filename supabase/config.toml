# Supabase project configuration
# Used by the Supabase CLI (supabase db push / supabase db seed)
# Install CLI: https://supabase.com/docs/guides/cli

[api]
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "https://motisha.co.ke"
additional_redirect_urls = ["http://localhost:3000", "https://localhost:3000", "http://localhost:3000/auth/reset-password", "https://motisha.co.ke/auth/reset-password", "https://motisha.co.ke", "https://www.motisha.co.ke"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true   # Email verification enabled for production

[auth.sms]
enable_signup = false
